    <noscript>
      <h1>ROBSONSMS — número virtual para receber SMS</h1>
      <p>
        A ROBSONSMS aluga números de telefone reais por alguns minutos para você receber
        código de verificação por SMS sem entregar o seu número pessoal. Você escolhe o
        serviço e o país, o código aparece na tela e o pedido se encerra. O pagamento é
        por PIX, em reais, a partir de R$ 5,00 de saldo — e você só paga pelo código que
        chegou: pedido que expira sem mensagem é estornado automaticamente.
      </p>
      <p>
        São centenas de serviços no catálogo, entre redes sociais, bancos digitais e
        aplicativos de transporte e entrega, com preço a partir de alguns centavos por
        código. O número é alugado, e não seu: quando o pedido fecha ele volta ao estoque,
        então ele não serve como telefone de recuperação de conta.
      </p>

    <script>
      var _temBackend = /^(localhost|127\.0\.0\.1|robsonsms\.onrender\.com)$/.test(location.hostname);
      if (_temBackend && 'serviceWorker' in navigator) {
        // backend no ar (local/Render): dispensa service worker e mata versões antigas,
        // para nenhum sw velho "sequestrar" os /api e quebrar o login.
        navigator.serviceWorker.getRegistrations().then(function (rs) {
          return Promise.all(rs.map(function (r) { return r.unregister(); }));
        }).catch(function () {});
      }
      if (!_temBackend && 'serviceWorker' in navigator && !/^file:/.test(location.protocol)) {
        var rsAntes = !!navigator.serviceWorker.controller;
        navigator.serviceWorker.addEventListener('controllerchange', function () {
          if (rsAntes && !sessionStorage.getItem('robsonsms-sw-v2')) { sessionStorage.setItem('robsonsms-sw-v2', '1'); location.reload(); }
        });
        navigator.serviceWorker.register('/sw.js', { scope: '/' })
          .then(function () { return navigator.serviceWorker.ready; })
          .then(function () {
            // entrar no meio, então recarrega uma única vez.
            if (!navigator.serviceWorker.controller &&
                !sessionStorage.getItem('robsonsms-sw')) {
              sessionStorage.setItem('robsonsms-sw', '1');
              location.replace(location.href);
            }
          })
          .catch(function (e) { console.warn('[robsonsms] service worker:', e); });
      }
